name: Release

# Tag the repo with vX.Y.Z to trigger a build. The workflow produces:
#   Windows : dist\LullMail-Setup-X.Y.Z.exe  (Inno Setup installer)
#   macOS   : dist/LullMail-X.Y.Z.dmg        (disk image with .app inside)
#   Linux   : dist/LullMail-X.Y.Z.tar.gz     (onedir bundle)
#
# All three are uploaded as workflow artifacts. On a tag push they are
# also attached to a *draft* GitHub release — review the artefacts, then
# click "Publish release" manually so a botched build never goes live
# by accident.
#
# workflow_dispatch is also wired so you can fire a build by hand from
# the Actions tab without having to push a tag.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: "Version (without leading 'v', e.g. 0.4.0). Required when running manually."
        required: true
        type: string

jobs:
  quality:
    uses: ./.github/workflows/ci.yml

  # ───────────────────────────────────────────────────────────────────────────
  # Windows — PyInstaller onedir → Inno Setup installer (.exe)
  # ───────────────────────────────────────────────────────────────────────────
  build-windows:
    needs: quality
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building Lull Mail $VERSION (Windows)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Create venv & install deps
        shell: cmd
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install --upgrade pip
          .venv\Scripts\pip install -r requirements.txt
          .venv\Scripts\pip install pyinstaller==6.11.1

      # Local LLM backend (llama-cpp-python). Missing from the v0.7.0 build,
      # which is why the installer crashed at runtime with ModuleNotFoundError.
      # PyPI doesn't publish a cp311 win_amd64 wheel for 0.3.0, so pip falls
      # back to building from source (long, fragile under MSVC). The abetlen
      # extra index serves a pre-built win_amd64 wheel that we use here.
      # Retried, and bash rather than cmd: the wheel is a GitHub release asset
      # on a third-party index, and one HTTP 504 from that CDN killed a whole
      # tagged release — the other two platforms built, this step failed on a
      # download nobody controls, and `release` was skipped, so no draft and
      # no signed manifest were produced.
      - name: Install local LLM backend
        shell: bash
        run: |
          for attempt in 1 2 3; do
            .venv/Scripts/pip install -r requirements-local.txt \
              --retries 5 --timeout 60 \
              --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu && exit 0
            echo "::warning::llama-cpp-python download failed (attempt $attempt/3); retrying in 30s"
            sleep 30
          done
          echo "::error::llama-cpp-python could not be downloaded after 3 attempts"
          exit 1

      - name: Build app (PyInstaller)
        shell: cmd
        env:
          LULLMAIL_NOINTERACT: '1'
          LULLMAIL_VERSION: ${{ steps.ver.outputs.version }}
          # Abort the build (instead of silently dropping llama_cpp) if the
          # previous "Install local LLM backend" step somehow regressed.
          LULLMAIL_REQUIRE_LOCAL: '1'
          # The trust store, sealed into the binary. Without these two the
          # build used to succeed with an EMPTY store, and the shipped app
          # then refused every update for ever — it cannot be repaired after
          # the fact, because the keys are baked in at this step.
          LULLMAIL_UPDATE_PUBLIC_KEYS: ${{ vars.LULLMAIL_UPDATE_PUBLIC_KEYS }}
          LULLMAIL_REQUIRE_SIGNED_UPDATES: '1'
        run: call scripts\build.bat

      - name: Verify build output
        shell: cmd
        run: |
          if not exist "dist\LullMail\LullMail.exe" (
            echo [ERROR] dist\LullMail\LullMail.exe missing.
            exit /b 1
          )

      - name: Locate Inno Setup
        shell: cmd
        run: |
          set "ISCC="
          if exist "%ProgramFiles(x86)%\Inno Setup 6\ISCC.exe" set "ISCC=%ProgramFiles(x86)%\Inno Setup 6\ISCC.exe"
          if exist "%ProgramFiles%\Inno Setup 6\ISCC.exe"      set "ISCC=%ProgramFiles%\Inno Setup 6\ISCC.exe"
          if "%ISCC%"=="" (
            echo Inno Setup not found, installing via Chocolatey...
            choco install innosetup -y --no-progress
            set "ISCC=%ProgramFiles(x86)%\Inno Setup 6\ISCC.exe"
          )
          echo ISCC=%ISCC%>> %GITHUB_ENV%

      - name: Compile installer
        shell: cmd
        run: |
          "%ISCC%" /Qp /DMyAppVersion=${{ steps.ver.outputs.version }} scripts\installer.iss

      - name: Verify installer output
        shell: cmd
        run: |
          if not exist "dist\LullMail-Setup-${{ steps.ver.outputs.version }}.exe" (
            echo [ERROR] Installer not produced.
            dir dist\
            exit /b 1
          )

      # Tells the signer which platform this file is for and how it
      # installs. The signer reads these; nothing produced them, which is why
      # no release has ever carried a manifest.
      - name: Describe the artifact
        shell: bash
        run: |
          python scripts/write_artifact_sidecar.py \
            --file "dist/LullMail-Setup-${{ steps.ver.outputs.version }}.exe" \
            --platform windows --arch "$RUNNER_ARCH" --install inno

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: LullMail-Setup-${{ steps.ver.outputs.version }}-windows
          path: |
            dist/LullMail-Setup-${{ steps.ver.outputs.version }}.exe
            dist/LullMail-Setup-${{ steps.ver.outputs.version }}.exe.artifact.json
          retention-days: 30

  # ───────────────────────────────────────────────────────────────────────────
  # macOS — PyInstaller onedir + .app bundle → hdiutil .dmg
  # ───────────────────────────────────────────────────────────────────────────
  build-macos:
    needs: quality
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building Lull Mail $VERSION (macOS)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Create venv & install deps
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt
          .venv/bin/pip install pyinstaller==6.11.1

      # Local LLM backend (llama-cpp-python). Same as Windows — PyPI doesn't
      # publish cp311 macOS wheels for 0.3.0, abetlen does.
      #
      # Retried: the wheel is a GitHub release asset on a third-party index,
      # and one HTTP 504 from that CDN killed a whole tagged release — the
      # other two platforms built, this step failed on a download nobody
      # controls, and `release` was skipped, so no draft and no signed
      # manifest were produced.
      - name: Install local LLM backend
        run: |
          for attempt in 1 2 3; do
            .venv/bin/pip install -r requirements-local.txt \
              --retries 5 --timeout 60 \
              --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu && exit 0
            echo "::warning::llama-cpp-python download failed (attempt $attempt/3); retrying in 30s"
            sleep 30
          done
          echo "::error::llama-cpp-python could not be downloaded after 3 attempts"
          exit 1

      # Generate .icns from the 1024px light source using sips + iconutil (both
      # built-in on macOS — no external dependencies needed).
      - name: Generate .icns icon
        run: |
          SRC="assets/lull_mail_light_1024.png"
          ICONSET="assets/lull_mail.iconset"
          mkdir -p "$ICONSET"
          for SIZE in 16 32 64 128 256 512; do
            sips -z $SIZE $SIZE "$SRC" --out "$ICONSET/icon_${SIZE}x${SIZE}.png"            > /dev/null
            sips -z $((SIZE*2)) $((SIZE*2)) "$SRC" --out "$ICONSET/icon_${SIZE}x${SIZE}@2x.png" > /dev/null
          done
          iconutil -c icns "$ICONSET" -o assets/lull_mail.icns
          rm -rf "$ICONSET"
          echo "Icon generated: assets/lull_mail.icns"

      - name: Build app (PyInstaller)
        env:
          LULLMAIL_NOINTERACT: '1'
          LULLMAIL_VERSION: ${{ steps.ver.outputs.version }}
          # Abort the build (instead of silently dropping llama_cpp) if the
          # previous "Install local LLM backend" step somehow regressed.
          LULLMAIL_REQUIRE_LOCAL: '1'
          # The trust store, sealed into the binary. Without these two the
          # build used to succeed with an EMPTY store, and the shipped app
          # then refused every update for ever — it cannot be repaired after
          # the fact, because the keys are baked in at this step.
          LULLMAIL_UPDATE_PUBLIC_KEYS: ${{ vars.LULLMAIL_UPDATE_PUBLIC_KEYS }}
          LULLMAIL_REQUIRE_SIGNED_UPDATES: '1'
        run: bash scripts/build.sh

      - name: Verify build output
        run: |
          if [[ ! -d "dist/LullMail.app" ]]; then
            echo "[ERROR] dist/LullMail.app missing."
            ls dist/ || true
            exit 1
          fi

      - name: Create .dmg
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          DMG="dist/LullMail-${VERSION}.dmg"
          # Stage the .app + an /Applications symlink in a temp dir so the
          # user gets the standard drag-to-install UX. Build directly to UDZO
          # to avoid the APFS/HFS device-path parsing issues with the rw approach.
          STAGING=$(mktemp -d)
          cp -r dist/LullMail.app "$STAGING/"
          ln -s /Applications "$STAGING/Applications"
          # hdiutil create on GitHub macOS runners is racy with Spotlight
          # indexing the freshly-copied tree — fails intermittently with
          # 'Resource busy'. Mark the staging dir as not-indexed where we
          # can (sudo not always available) and retry the call up to 3
          # times with backoff.
          xattr -w com.apple.metadata:com_apple_backup_excludeItem "com.apple.backupd.IndexExcludedItems" "$STAGING" 2>/dev/null || true
          for attempt in 1 2 3; do
            if hdiutil create \
                -volname "Lull Mail ${VERSION}" \
                -srcfolder "$STAGING" \
                -ov -format UDZO \
                "$DMG"; then
              break
            fi
            if [[ $attempt -lt 3 ]]; then
              echo "hdiutil failed on attempt $attempt, retrying after backoff..."
              sleep $((attempt * 5))
            else
              echo "[ERROR] hdiutil failed after 3 attempts."
              exit 1
            fi
          done
          rm -rf "$STAGING"
          echo "DMG created: $DMG"

      - name: Verify .dmg
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          if [[ ! -f "dist/LullMail-${VERSION}.dmg" ]]; then
            echo "[ERROR] DMG not produced."
            ls dist/ || true
            exit 1
          fi

      - name: Describe the artifact
        run: |
          python scripts/write_artifact_sidecar.py \
            --file "dist/LullMail-${{ steps.ver.outputs.version }}.dmg" \
            --platform macos --arch "$RUNNER_ARCH" --install dmg

      - name: Upload .dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: LullMail-${{ steps.ver.outputs.version }}-macos
          path: |
            dist/LullMail-${{ steps.ver.outputs.version }}.dmg
            dist/LullMail-${{ steps.ver.outputs.version }}.dmg.artifact.json
          retention-days: 30

  # ───────────────────────────────────────────────────────────────────────────
  # Linux — PyInstaller onedir → .tar.gz
  # ───────────────────────────────────────────────────────────────────────────
  build-linux:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building Lull Mail $VERSION (Linux)"

      # pywebview on Linux uses the GTK WebKit backend at runtime.
      # The library must be present on the build machine so PyInstaller
      # can find and bundle the right shared objects.
      - name: Install WebKitGTK
        run: |
          sudo apt-get update -qq
          # Try 4.1 first (Ubuntu 22.04+), fall back to 4.0 (20.04)
          sudo apt-get install -y libwebkit2gtk-4.1-dev || \
          sudo apt-get install -y libwebkit2gtk-4.0-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Create venv & install deps
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt
          .venv/bin/pip install pyinstaller==6.11.1

      # Local LLM backend (llama-cpp-python). PyPI has cp311 manylinux wheels;
      # see notes on the Windows step about why no extra-index here (it served
      # a musllinux wheel that couldn't load on Ubuntu's glibc).
      - name: Install local LLM backend
        run: .venv/bin/pip install -r requirements-local.txt

      - name: Build app (PyInstaller)
        env:
          LULLMAIL_NOINTERACT: '1'
          LULLMAIL_VERSION: ${{ steps.ver.outputs.version }}
          # Abort the build (instead of silently dropping llama_cpp) if the
          # previous "Install local LLM backend" step somehow regressed.
          LULLMAIL_REQUIRE_LOCAL: '1'
          # The trust store, sealed into the binary. Without these two the
          # build used to succeed with an EMPTY store, and the shipped app
          # then refused every update for ever — it cannot be repaired after
          # the fact, because the keys are baked in at this step.
          LULLMAIL_UPDATE_PUBLIC_KEYS: ${{ vars.LULLMAIL_UPDATE_PUBLIC_KEYS }}
          LULLMAIL_REQUIRE_SIGNED_UPDATES: '1'
        run: bash scripts/build.sh

      - name: Verify build output
        run: |
          if [[ ! -f "dist/LullMail/LullMail" ]]; then
            echo "[ERROR] dist/LullMail/LullMail missing."
            ls dist/ || true
            exit 1
          fi

      - name: Create .tar.gz
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          ARCHIVE="dist/LullMail-${VERSION}.tar.gz"
          tar -czf "$ARCHIVE" -C dist LullMail
          echo "Archive created: $ARCHIVE"

      - name: Verify .tar.gz
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          if [[ ! -f "dist/LullMail-${VERSION}.tar.gz" ]]; then
            echo "[ERROR] Archive not produced."
            ls dist/ || true
            exit 1
          fi

      - name: Describe the artifact
        run: |
          python scripts/write_artifact_sidecar.py \
            --file "dist/LullMail-${{ steps.ver.outputs.version }}.tar.gz" \
            --platform linux --arch "$RUNNER_ARCH" --install tar.gz

      - name: Upload .tar.gz artifact
        uses: actions/upload-artifact@v4
        with:
          name: LullMail-${{ steps.ver.outputs.version }}-linux
          path: |
            dist/LullMail-${{ steps.ver.outputs.version }}.tar.gz
            dist/LullMail-${{ steps.ver.outputs.version }}.tar.gz.artifact.json
          retention-days: 30

  # ───────────────────────────────────────────────────────────────────────────
  # Draft release — runs only on tag push, after all three builds succeed
  # ───────────────────────────────────────────────────────────────────────────
  release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: LullMail-Setup-${{ steps.ver.outputs.version }}-windows
          path: release-assets/

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: LullMail-${{ steps.ver.outputs.version }}-macos
          path: release-assets/

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: LullMail-${{ steps.ver.outputs.version }}-linux
          path: release-assets/

      # Everything above this point only collected files. The manifest is
      # what the in-app updater actually reads: it names each artifact, its
      # size and its SHA-256, and it is signed with a key the shipped
      # binaries already trust. Without it check_for_update() has nothing to
      # verify and every install stays on its current version for ever.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install signing dependency
        run: python -m pip install --quiet 'cryptography>=42'

      - name: Sign the update manifest
        env:
          UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY }}
        run: |
          if [[ -z "$UPDATE_SIGNING_PRIVATE_KEY" ]]; then
            echo "::error::UPDATE_SIGNING_PRIVATE_KEY is not set. The builds"
            echo "::error::already trust a key, so publishing without a signed"
            echo "::error::manifest would ship a release no install can see."
            exit 1
          fi
          KEY_ID='${{ vars.LULLMAIL_UPDATE_KEY_ID }}'
          if [[ -z "$KEY_ID" ]]; then
            echo "::error::Set the repository variable LULLMAIL_UPDATE_KEY_ID"
            echo "::error::to the key id used in LULLMAIL_UPDATE_PUBLIC_KEYS."
            exit 1
          fi
          # NOT $GITHUB_REPOSITORY. Every artifact URL in the manifest has to
          # sit under the repository the shipped binaries trust
          # (src/updater.py::GITHUB_REPO), because _validate_artifact rejects
          # anything else. A release cut from a different repo would produce
          # a perfectly valid signature over URLs every install refuses, and
          # the only symptom would be "no update available", for ever.
          REPO=$(python -c 'import src.updater as u; print(u.GITHUB_REPO)')
          echo "Artifact URLs will point at $REPO"
          python scripts/sign_update_manifest.py \
            --artifact-dir release-assets \
            --repo "$REPO" \
            --tag "$GITHUB_REF_NAME" \
            --version "${{ steps.ver.outputs.version }}" \
            --key-id "$KEY_ID"
          # The sidecars are build metadata, not something users download.
          rm -f release-assets/*.artifact.json
          ls -l release-assets/

      # A signature the shipped binaries cannot verify is the same as no
      # release at all, and it is far cheaper to find out here.
      - name: Verify the manifest against the published public keys
        env:
          LULLMAIL_UPDATE_PUBLIC_KEYS: ${{ vars.LULLMAIL_UPDATE_PUBLIC_KEYS }}
        run: python scripts/verify_release_manifest.py --artifact-dir release-assets

      # Body is left to GitHub's generated notes; maintainers replace it
      # with a short English user-facing summary before publish — see docs/RELEASE-NOTES.md
      - name: Create draft GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Lull Mail ${{ steps.ver.outputs.version }}
          tag_name: ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          files: release-assets/*
