name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
  workflow_call:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      # pnpm before Node, not after: `cache: pnpm` makes setup-node shell out
      # to `pnpm store path --silent` to find the store, so with pnpm not yet
      # installed the step fails with "Unable to locate executable file: pnpm"
      # and takes the whole job — and, through `needs: quality`, every
      # release build — with it.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # bash so a failure is fatal: under cmd a step's exit code is only its
      # last command's, so a failed `pip install` here was invisible.
      - name: Install Python dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install frontend dependencies
        shell: bash
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Run Python tests
        shell: cmd
        run: pytest -q --tb=short

      - name: Check frontend syntax
        shell: cmd
        run: for %%f in (frontend\*.js) do node --check "%%f"

      - name: Run frontend quality checks
        shell: cmd
        working-directory: frontend
        run: pnpm quality

      # The cleanup rules engine was removed because nothing ever ran it: a
      # "rule" was a saved filter behind a 48-control form that the user had
      # to come back and trigger by hand. Reintroducing any of these symbols
      # would bring back the empty-filter hazard the card ids were designed
      # to retire, so fail here rather than in review.
      - name: No trace of the retired rules engine
        shell: bash
        run: |
          set -e
          patterns='find_by_filter|RuleFilter|RuleRunReq|CustomRuleBody|CustomRulePatch|cleanup/rules/(preview|run)|cleanup/custom-rules|db\.bulk_set_folder\(|db\.bulk_mark_read\('
          if grep -rEn "$patterns" src frontend --include='*.py' --include='*.js' \
               | grep -v 'custom_rules_removed_v1'; then
            echo "::error::the cleanup rules engine is back; see the commit that removed it"
            exit 1
          fi
          echo "clean"

  browser:
    needs: test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      # pnpm before Node, not after: `cache: pnpm` makes setup-node shell out
      # to `pnpm store path --silent` to find the store, so with pnpm not yet
      # installed the step fails with "Unable to locate executable file: pnpm"
      # and takes the whole job — and, through `needs: quality`, every
      # release build — with it.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # bash, not cmd. `pnpm` on Windows is a .cmd shim, and inside a batch
      # script calling one .cmd from another WITHOUT `call` transfers control
      # and never returns — so `pnpm install` ran, the script ended there, and
      # `playwright install` silently never executed. The step still exited 0,
      # and the browser was simply absent: every test then failed with
      # "Executable doesn't exist at …\chromium_headless_shell-1187\…".
      # bash has no such rule, and -e makes a real failure fatal instead of
      # letting the step's exit code come from whichever line happened to run
      # last.
      # --with-deps installs Media Foundation on Windows Server, which
      # WebKit's media code loads. Playwright keys that install on "chromium"
      # being among the targets, not on webkit: keep both on this one line,
      # or the install quietly stops (check-browser.mjs would then fail).
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          cd frontend
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium webkit

      # A missing browser must never again look like a successful install.
      # --dry-run would not do: it prints what WOULD be downloaded whether or
      # not anything is there. Launching is the only check that answers the
      # question the tests are about to ask.
      - name: Verify the browser actually launches
        shell: bash
        working-directory: frontend
        run: node scripts/check-browser.mjs

      - name: Run Playwright
        shell: cmd
        working-directory: frontend
        run: pnpm test:e2e

      # Its own server, its own port, three mailboxes. Separate because the
      # account count is fixed when the server boots, and because mixing it
      # into the suite above would have moved every single-account baseline.
      - name: Run Playwright (multi-account)
        shell: cmd
        working-directory: frontend
        run: pnpm test:e2e:multi

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14
