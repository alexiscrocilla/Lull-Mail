name: CI

# Run the security/regression test suite on every push to develop and
# every pull-request targeting it. The release workflow (release.yml)
# also gates on this — a red CI here means the .exe build won't fire
# even if the tag is pushed.

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dev dependencies
        shell: cmd
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pytest
        shell: cmd
        run: pytest -q --tb=short

      - name: Check frontend syntax
        shell: cmd
        run: for %%f in (frontend\*.js) do node --check "%%f"

      - name: Run frontend regression tests
        shell: cmd
        run: node --test frontend/tests/*.test.mjs
