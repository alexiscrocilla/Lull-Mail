[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Suppress the noisy DB / scheduler logs that fire when test fixtures
# import the wider app — they'd make the pytest output unreadable
# without affecting test outcomes.
log_cli = false
log_level = WARNING
filterwarnings =
    ignore::DeprecationWarning
addopts = -ra
